name: vpn-desk
base: core22
version: '0.1.0'
summary: Desktop GUI for Tor country simulation
description: Start/stop Tor with a chosen country exit node from a Flutter desktop app.
grade: stable
confinement: strict

app:
  command: vpn_desk
  plugs: [network, network-bind, home]

parts:
  vpn-desk:
    plugin: nil
    source: build/linux/x64/release/bundle
    stage-packages: [libgtk-3-0]
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/opt/vpn_desk
      cp -r . $CRAFT_PART_INSTALL/opt/vpn_desk/
      mkdir -p $CRAFT_PART_INSTALL/bin $CRAFT_PART_INSTALL/meta/gui
      ln -s /opt/vpn_desk/vpn_desk $CRAFT_PART_INSTALL/bin/vpn_desk
      cp $CRAFT_PROJECT_DIR/packaging/vpn_desk.desktop $CRAFT_PART_INSTALL/meta/gui/vpn_desk.desktop
