name: oniondesk
base: core22
version: '0.1.0'
summary: Desktop GUI for Tor country simulation
description: Start/stop Tor with a chosen country exit node from a Flutter desktop app.
grade: stable
confinement: strict

app:
  command: oniondesk
  plugs: [network, network-bind, home]

parts:
  oniondesk:
    plugin: nil
    source: build/linux/x64/release/bundle
    stage-packages: [libgtk-3-0]
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/opt/oniondesk
      cp -r . $CRAFT_PART_INSTALL/opt/oniondesk/
      mkdir -p $CRAFT_PART_INSTALL/bin $CRAFT_PART_INSTALL/meta/gui
      ln -s /opt/oniondesk/oniondesk $CRAFT_PART_INSTALL/bin/oniondesk
      cp $CRAFT_PROJECT_DIR/packaging/oniondesk.desktop $CRAFT_PART_INSTALL/meta/gui/oniondesk.desktop
