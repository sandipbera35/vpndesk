# Linux installers (x64 + arm64) with tor bundled. macOS/Windows scripts exist but are not built yet.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach the macOS DMGs to (e.g. v1.1.0)'
        required: false
permissions:
  contents: write
jobs:
  linux:
    if: github.event_name == 'push'   # a manual dispatch only re-attaches mac/windows or rebuilds the package repo
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          channel: stable
      # subosito can't find a Linux arm64 SDK release, so use the stable git checkout there.
      - name: Install Flutter (arm64)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev rpm libevent-dev libssl-dev zlib1g-dev libboost-program-options-dev dpkg-dev appstream desktop-file-utils imagemagick
      # CEF 149's headers need C++20 implicit typename, which Ubuntu 22.04's clang 14 rejects: use clang 18 from apt.llvm.org
      # (still built on 22.04 so the packages keep the old glibc requirement).
      - name: Install clang 18
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh && chmod +x /tmp/llvm.sh && sudo /tmp/llvm.sh 18
          sudo apt-get install -y libstdc++-12-dev
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang && sudo ln -sf /usr/bin/clang++-18 /usr/bin/clang++
          clang --version
      - name: Build app
        run: flutter pub get && flutter build linux --release
      - name: Bundle tor
        run: ./bundle_tor.sh
      # i2pd for the I2P tab. Never allowed to block the release: without it the app falls back to an installed i2pd.
      - name: Bundle i2pd (built from source, self-contained)
        continue-on-error: true
        run: ./build_i2pd_linux.sh "build/linux/${{ matrix.arch }}/release/bundle/i2pd"
      - name: Bundle the I2P force shim (libproxychains4.so)
        continue-on-error: true
        run: ./build_proxychains_linux.sh "build/linux/${{ matrix.arch }}/release/bundle/i2pd/force"
      - name: Package
        run: ./package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  repo:
    # Signed apt + dnf repositories on GitHub Pages, so users can `sudo apt install oniondesk` / `sudo dnf install oniondesk`.
    # Needs repo secrets GPG_PRIVATE_KEY (armored) and GPG_KEY_ID, and Pages set to the gh-pages branch.
    needs: linux
    continue-on-error: true   # stays red until the signing secrets exist; the release itself is unaffected
    # after a tag build, or by hand: workflow_dispatch with tag=vX.Y.Z rebuilds the repo from that release's packages
    if: always() && (needs.linux.result == 'success' || needs.linux.result == 'skipped') && (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # The packages are already attached to the release by the linux job (needs: linux).
      - name: Download the release packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ inputs.tag || github.ref_name }}" -p '*.deb' -p '*.rpm' -D dist
      - run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils createrepo-c gnupg rpm
      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Build repositories
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: packaging/repo/build-repos.sh
      - name: Publish apt repo and signed rpms to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # packages are over Pages' 100 MB file limit, so they live on releases: apt flat repo in the "apt" release,
          # the signed rpms replace the unsigned ones on the version's release (the dnf metadata records their checksums)
          gh release view apt >/dev/null 2>&1 || gh release create apt --target "$GITHUB_SHA" --prerelease --title "APT repository (used by apt, not a download)" --notes "Flat apt repository for OnionDesk. Do not download from here; see https://sandipbera35.github.io/vpndesk/"
          gh release upload apt aptflat/* --clobber
          for old in $(gh release view apt --json assets -q '.assets[].name'); do [ -e "aptflat/$old" ] || gh release delete-asset apt "$old" --yes; done
          gh release upload "$TAG" signed-rpm/* --clobber
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          force_orphan: true

  macos:
    # Apple Silicon (arm64) and Intel DMGs. Ad-hoc signed (not notarized): first launch needs right-click > Open.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: aarch64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build tools for the browser engine (CEF wrapper)
        run: brew install cmake ninja || true
      - name: Build app
        env:
          CEF_WRAPPER_BUILD_TYPE: Release
        run: flutter pub get && flutter build macos --release
      - name: Package DMG (tor bundled)
        run: ./package_mac.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*.dmg

  windows:
    # Native x64 and arm64 installers. Tor publishes no Windows arm64 bundle, so arm64 ships the x64 tor.exe (runs under Windows' x64 emulation).
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # OnionDesk Browser (CEF) has no Windows arm64 build: arm64 PCs run this x64 installer under Windows' emulation.
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          channel: stable
      - name: Install Flutter (arm64)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Build app
        run: flutter pub get && flutter build windows --release
      - name: Bundle tor
        run: ./fetch_tor.sh windows x86_64 "build/windows/${{ matrix.arch }}/runner/Release/tor"
      - name: Bundle i2pd (I2P tab; the x64 build also runs on arm64 under emulation)
        continue-on-error: true
        run: ./fetch_i2pd.sh windows "build/windows/${{ matrix.arch }}/runner/Release/i2pd"
      - name: Build installer
        env:
          MSYS_NO_PATHCONV: '1'   # Git Bash would turn /DAppVersion=... into a path
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          command -v iscc >/dev/null || choco install innosetup -y --no-progress
          ISCC="$(command -v iscc || echo '/c/Program Files (x86)/Inno Setup 6/ISCC.exe')"
          "$ISCC" windows_installer.iss "/DAppVersion=$VERSION" "/DArch=${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*.exe
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*.exe
