# Linux installers (x64 + arm64) with tor bundled. macOS/Windows scripts exist but are not built yet.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach the macOS DMGs to (e.g. v1.1.0)'
        required: false
permissions:
  contents: write
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          channel: stable
      # subosito can't find a Linux arm64 SDK release, so use the stable git checkout there.
      - name: Install Flutter (arm64)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev rpm libevent-dev libssl-dev zlib1g-dev dpkg-dev appstream desktop-file-utils imagemagick
      - name: Build app
        run: flutter pub get && flutter build linux --release
      - name: Bundle tor and package
        run: ./bundle_tor.sh && ./package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  repo:
    # Signed apt + dnf repositories on GitHub Pages, so users can `sudo apt install oniondesk` / `sudo dnf install oniondesk`.
    # Needs repo secrets GPG_PRIVATE_KEY (armored) and GPG_KEY_ID, and Pages set to the gh-pages branch.
    needs: linux
    continue-on-error: true   # stays red until the signing secrets exist; the release itself is unaffected
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils createrepo-c gnupg
      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Build repositories
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: packaging/repo/build-repos.sh
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          force_orphan: true

  macos:
    # Apple Silicon (arm64) and Intel DMGs. Ad-hoc signed (not notarized): first launch needs right-click > Open.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: aarch64
          - os: macos-13
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build app
        run: flutter pub get && flutter build macos --release
      - name: Package DMG (tor bundled)
        run: ./package_mac.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*.dmg
